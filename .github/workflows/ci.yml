name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux runs the full suite: sysinfo and the e2e test are portable, and the
  # hub is expected to live on any box.
  linux:
    uses: nhatvu148/shared-workflows/.github/workflows/rust-ci.yml@v2
    with:
      components: clippy, rustfmt
      commands: |
        cargo fmt --all --check
        cargo clippy --all-targets -- -D warnings
        cargo test --all

  # The agent's main target is Windows, where sysinfo takes a different code
  # path entirely. Test it there rather than assume.
  windows:
    uses: nhatvu148/shared-workflows/.github/workflows/rust-ci.yml@v2
    with:
      runner: '"windows-latest"'
      cache-key: windows
      commands: |
        cargo test --all

  # Only from main, only once both test jobs pass. Public repo, so the package
  # is made public and the server pulls it anonymously.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, windows]
    uses: nhatvu148/shared-workflows/.github/workflows/docker-publish.yml@v2
    permissions:
      contents: read
      packages: write
    with:
      dockerfile: ./docker/Dockerfile
      platforms: linux/amd64
      package-name: fleetmon
      min-versions-to-keep: 10
      require-public: true
