[workspace]
resolver = "3"
members = ["crates/proto", "crates/agent", "crates/hub"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nhatvu148/fleetmon"
authors = ["Nhat-Vu <nhatvu148@gmail.com>"]

[workspace.dependencies]
fleetmon-proto = { path = "crates/proto" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
