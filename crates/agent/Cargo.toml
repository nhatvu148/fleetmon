[package]
name = "fleetmon-agent"
description = "Samples this machine and pushes it to a fleetmon hub"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fleetmon-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
futures-util.workspace = true
serde_json.workspace = true
sysinfo = "0.39"
tokio.workspace = true
# wss:// with bundled roots, so it behaves the same on a Windows box whose
# certificate store nobody maintains.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# The crypto backend, chosen explicitly: rustls ships with none enabled here.
# ring rather than aws-lc-rs because aws-lc-rs needs cmake and nasm to build on
# Windows, which the agent's main target should not require.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing.workspace = true
tracing-subscriber.workspace = true
