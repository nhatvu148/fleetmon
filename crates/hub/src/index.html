<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fleetmon</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8; --card: #fff; --inset: #eef0f3; --hover: #f3f5f8; --fg: #1b1f24; --muted: #6b7280; --line: #e5e7eb;
    /* Chart series from a palette validated for colour-vision deficiency in both
       themes; slots 1 and 2 are the only pair any chart puts side by side. */
    --s1: #2a78d6; --s2: #eb6834;
    --ok: #0ca30c; --warn: #b87800; --hot: #d93b3b; --off: #9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0e1014; --card: #161920; --inset: #1d2129; --hover: #1b1f27; --fg: #e6e8eb; --muted: #8b93a1; --line: #252a33;
      --s1: #3987e5; --s2: #d95926;
      --ok: #0ca30c; --warn: #fab219; --hot: #f16b6b; --off: #4b5563;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  h1 a { text-decoration: none; }
  #status { color: var(--muted); font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; display: inline-block; }
  .dot.off { background: var(--off); }
  .empty { color: var(--muted); padding: 16px; }
  .flag { font-size: 11px; margin-left: 4px; }
  .flag.warn { color: var(--warn); }
  .flag.hot { color: var(--hot); }
  [hidden] { display: none !important; }

  /* ---- overview: one row per machine ---- */
  #overview { padding: 0 16px 24px; }
  .fleet { overflow-x: auto; }
  .fleet table { width: 100%; border-collapse: collapse; min-width: 860px; }
  .fleet th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
  .fleet th[data-sort] { cursor: pointer; }
  .fleet th[aria-sort] { color: var(--fg); }
  .fleet td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .fleet tr:last-child td { border-bottom: 0; }
  .fleet tbody tr { cursor: pointer; }
  .fleet tbody tr:hover, .fleet tbody tr:focus-visible { background: var(--hover); outline: none; }
  .fleet tr.off td { opacity: .5; }
  .fleet td:first-child, .fleet th:first-child { position: sticky; left: 0; background: var(--card); }
  .fleet tbody tr:hover td:first-child { background: var(--hover); }
  .who { display: flex; align-items: center; gap: 8px; min-width: 170px; }
  .who b { font-weight: 600; }
  .who small { display: block; color: var(--muted); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gauge { display: grid; grid-template-columns: minmax(70px, 1fr) 46px; align-items: center; gap: 8px; min-width: 130px; }
  .gauge .v { text-align: right; font-size: 13px; }
  .meter { height: 6px; background: var(--inset); border-radius: 3px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--s1); border-radius: 3px; }
  .meter.warn > div { background: var(--warn); }
  .meter.hot > div { background: var(--hot); }
  .cell-sub { font-size: 12px; color: var(--muted); }

  /* ---- detail: Task Manager's performance layout ---- */
  #detail { padding: 0 16px 24px; display: grid; gap: 16px; }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 20px; }
  .head .back { font-size: 13px; color: var(--muted); text-decoration: none; }
  .head .back:hover { color: var(--fg); }
  .ranges { margin-left: auto; display: inline-flex; background: var(--inset); border-radius: 8px; padding: 3px; gap: 2px; }
  .ranges button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .ranges button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
  .perf { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
  .rail { display: grid; gap: 4px; padding: 6px; }
  .rail button { display: grid; grid-template-columns: 1fr 70px; grid-template-rows: auto auto; gap: 0 10px; align-items: center; text-align: left; border: 0; background: none; border-radius: 8px; padding: 8px 10px; cursor: pointer; position: relative; }
  .rail button:hover { background: var(--hover); }
  .rail button[aria-current="true"] { background: var(--inset); }
  .rail button[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--s1); }
  .rail .t { font-weight: 600; font-size: 13px; }
  .rail .s { font-size: 12px; color: var(--muted); grid-column: 1; }
  .rail canvas { grid-row: 1 / span 2; grid-column: 2; width: 70px; height: 30px; }
  .main { padding: 16px; display: grid; gap: 16px; }
  .main-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .main-head h3 { margin: 0; font-size: 22px; font-weight: 600; }
  .main-head .sub { color: var(--muted); margin-left: auto; font-size: 13px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .chart { position: relative; }
  .chart canvas { width: 100%; height: 260px; display: block; touch-action: none; }
  .tip { position: absolute; top: 4px; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 8px rgb(0 0 0 / .15); }
  .tip strong { font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px 20px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 18px; font-weight: 600; white-space: nowrap; }
  h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .cores { display: grid; grid-template-columns: repeat(auto-fit, minmax(30px, 1fr)); gap: 5px; }
  .core { display: grid; gap: 3px; justify-items: center; font-size: 11px; color: var(--muted); }
  .core .bar { width: 100%; height: 70px; background: var(--inset); border-radius: 4px; position: relative; overflow: hidden; }
  .core .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 4px 4px 0 0; }
  table.plain { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.plain th { font-size: 12px; color: var(--muted); font-weight: 500; text-align: left; padding: 4px 0; }
  table.plain td { padding: 5px 0; border-top: 1px solid var(--line); }
  table.plain .r { text-align: right; }
  table.plain td.r { color: var(--muted); }
  table.plain td.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 0; width: 60%; }
  .item { display: grid; gap: 4px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .item:first-child { border-top: 0; }
  .item .line { display: flex; gap: 8px; justify-content: space-between; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  .note { font-size: 13px; color: var(--muted); background: var(--inset); border-radius: 8px; padding: 10px 12px; }
  @media (max-width: 820px) {
    .perf { grid-template-columns: minmax(0, 1fr); }
    .rail { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .ranges { margin-left: 0; }
  }
</style>
</head>
<body>
<header><h1><a href="#">fleetmon</a></h1><span id="status">connecting…</span></header>
<main id="overview"></main>
<main id="detail" hidden></main>
<script>
'use strict';
const hosts = new Map(); // name -> {info, online, history[] (slim, live window), latest}
let limit = 300;
const overview = document.getElementById('overview');
const detail = document.getElementById('detail');
const status = document.getElementById('status');

// ---------------------------------------------------------------- formatting
const MB = 1048576, GB = 1073741824, TB = 1099511627776;
const trim1 = v => v.toFixed(1).replace(/\.0$/, '');
const gb = b => (b / GB).toFixed(1);
const size = b => b >= TB ? (b / TB).toFixed(2) + ' TB' : b >= GB ? (b / GB).toFixed(1) + ' GB' : (b / MB).toFixed(0) + ' MB';
const rate = b => b >= MB ? trim1(b / MB) + ' MB/s' : b >= 1024 ? (b / 1024).toFixed(0) + ' KB/s' : Math.round(b) + ' B/s';
const pct = v => (v == null || isNaN(v) ? '—' : v.toFixed(0) + '%');
const dur = s => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const level = (v, warn, hot) => v == null ? '' : v >= hot ? 'hot' : v >= warn ? 'warn' : '';
const dark = () => matchMedia('(prefers-color-scheme: dark)').matches;

// Status levels never rely on colour alone: the flag carries a symbol and a title.
const flag = (lv, what) => lv ? el('span', { class: 'flag ' + lv, title: `${what} ${lv === 'hot' ? 'critical' : 'high'}` }, lv === 'hot' ? '▲▲' : '▲') : null;

// Every agent-supplied string goes into text nodes, never HTML.
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}

function slim(s) {
  const { top, top_mem, cpu_cores, disks, ifaces, temps, ...rest } = s;
  return rest;
}
const memPct = (s, info) => s && s.mem_used != null ? s.mem_used / info.mem_total * 100 : null;
const mainDisk = L => (L && L.disks || [])[0];
const diskPct = d => d ? (d.total - d.available) / d.total * 100 : null;
const rich = h => h.latest && (h.latest.cpu_cores || []).length > 0;

// ---------------------------------------------------------------- ranges & data
const RANGES = { '5m': 300e3, '1h': 3600e3, '24h': 86400e3, '7d': 7 * 86400e3, '30d': 30 * 86400e3 };
const cache = new Map(); // `${host}|${range}` -> {at, points}
let hubHasHistory = true;

async function fetchRange(host, range) {
  const key = `${host}|${range}`, hit = cache.get(key);
  const maxAge = range === '1h' ? 20e3 : 60e3;
  if (hit && Date.now() - hit.at < maxAge) return hit.points;
  const r = await fetch(`api/history?host=${encodeURIComponent(host)}&range=${range}`);
  if (r.status === 404) { hubHasHistory = false; return []; }
  if (!r.ok) throw new Error(`history ${r.status}`);
  const points = await r.json();
  cache.set(key, { at: Date.now(), points });
  return points;
}

// ---------------------------------------------------------------- charts
function niceMax(v, unit = 1) {
  if (!(v > 0)) return 1;
  let base = 1;
  if (unit > 1) while (v / (base * unit) >= 1) base *= unit;
  const x = v / base, p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p * base;
}

function tickLabel(t, span) {
  const d = new Date(t);
  if (span > 86400e3 * 1.5) return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function tipTime(t, span) {
  const d = new Date(t);
  const time = d.toLocaleTimeString([], span <= 3600e3 ? { hour: '2-digit', minute: '2-digit', second: '2-digit' } : { hour: '2-digit', minute: '2-digit' });
  return span > 86400e3 ? `${d.toLocaleDateString([], { day: 'numeric', month: 'short' })} ${time}` : time;
}

// Time-based x axis over [now - span, now]; a gap wider than a few steps (the
// machine was off, or the hub was) breaks the line instead of bridging it.
function drawChart(canvas, spec, hoverX) {
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w) return null;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const padL = 68, padR = 10, padT = 10, padB = 22, pw = w - padL - padR, ph = h - padT - padB;
  const all = spec.series.flatMap(s => s.values).filter(v => v != null);
  const max = spec.max != null ? spec.max : niceMax(Math.max(0, ...all) * 1.1, spec.unit);
  const muted = css('--muted'), line = css('--line');
  const end = spec.end, start = end - spec.span;
  const X = t => padL + (t - start) / spec.span * pw, Y = v => padT + ph - (Math.min(v, max) / max) * ph;

  g.font = '11px system-ui, sans-serif';
  g.fillStyle = muted; g.textAlign = 'right'; g.textBaseline = 'middle';
  for (let i = 0; i <= 2; i++) {
    const v = max * i / 2, y = Y(v);
    g.strokeStyle = line; g.lineWidth = 1;
    g.beginPath(); g.moveTo(padL, Math.round(y) + .5); g.lineTo(w - padR, Math.round(y) + .5); g.stroke();
    g.fillText(spec.fmt(v), padL - 8, y);
  }
  g.textBaseline = 'alphabetic';
  // About one time label per 130 px, so narrow (phone) charts do not overlap.
  const ticks = Math.max(2, Math.min(4, Math.floor(pw / 130)));
  for (let i = 0; i <= ticks; i++) {
    const t = start + spec.span * i / ticks;
    g.textAlign = i === 0 ? 'left' : i === ticks ? 'right' : 'center';
    g.fillText(i === ticks ? 'now' : tickLabel(t, spec.span), X(t), h - 5);
  }

  const n = spec.times.length;
  if (!n) {
    g.textAlign = 'center'; g.fillText(spec.empty || 'No data in this range yet', padL + pw / 2, padT + ph / 2);
    return null;
  }
  const steps = [];
  for (let i = 1; i < n; i++) steps.push(spec.times[i] - spec.times[i - 1]);
  const typical = steps.length ? steps.slice().sort((a, b) => a - b)[Math.floor(steps.length / 2)] : 0;
  const gap = Math.max(typical * 4, 5000);
  for (const s of spec.series) {
    g.beginPath(); let on = false;
    s.values.forEach((v, i) => {
      if (v == null || (i && spec.times[i] - spec.times[i - 1] > gap)) on = false;
      if (v == null) return;
      const x = X(spec.times[i]), y = Y(v);
      on ? g.lineTo(x, y) : g.moveTo(x, y); on = true;
    });
    g.strokeStyle = s.color; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
  }
  if (spec.series.length === 1) {
    const s = spec.series[0];
    g.globalAlpha = .12; g.fillStyle = s.color;
    let seg = [];
    const flush = () => { if (seg.length > 1) { g.beginPath(); g.moveTo(seg[0][0], padT + ph); seg.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(seg[seg.length - 1][0], padT + ph); g.closePath(); g.fill(); } seg = []; };
    s.values.forEach((v, i) => { if (v == null || (i && spec.times[i] - spec.times[i - 1] > gap)) flush(); if (v != null) seg.push([X(spec.times[i]), Y(v)]); });
    flush(); g.globalAlpha = 1;
  }

  if (hoverX == null || hoverX < padL) return null;
  const t = start + (hoverX - padL) / pw * spec.span;
  let i = 0, best = Infinity;
  spec.times.forEach((ti, k) => { const d = Math.abs(ti - t); if (d < best) { best = d; i = k; } });
  const x = X(spec.times[i]);
  g.strokeStyle = muted; g.lineWidth = 1;
  g.beginPath(); g.moveTo(Math.round(x) + .5, padT); g.lineTo(Math.round(x) + .5, padT + ph); g.stroke();
  const card = css('--card');
  for (const s of spec.series) {
    const v = s.values[i]; if (v == null) continue;
    g.beginPath(); g.arc(x, Y(v), 4, 0, Math.PI * 2);
    g.fillStyle = s.color; g.fill(); g.lineWidth = 2; g.strokeStyle = card; g.stroke();
  }
  return { i, x };
}

function bigChart() {
  const canvas = el('canvas', { role: 'img' });
  const tip = el('div', { class: 'tip', hidden: true });
  const root = el('div', { class: 'chart' }, canvas, tip);
  const c = { root, spec: null, hoverX: null };
  const draw = () => {
    if (!c.spec) return;
    const hit = drawChart(canvas, c.spec, c.hoverX);
    if (!hit) { tip.hidden = true; return; }
    tip.replaceChildren(el('div', { class: 'muted' }, tipTime(c.spec.times[hit.i], c.spec.span)),
      ...c.spec.series.map(s => el('div', {}, el('span', { class: 'sw', style: `background:${s.color}` }),
        el('strong', { class: 'num' }, s.values[hit.i] == null ? '—' : c.spec.fmt(s.values[hit.i])), ' ', s.label)));
    tip.hidden = false;
    const tw = tip.offsetWidth, cw = canvas.clientWidth;
    tip.style.left = (hit.x + 12 + tw > cw ? hit.x - 12 - tw : hit.x + 12) + 'px';
  };
  canvas.addEventListener('pointermove', e => { c.hoverX = e.offsetX; draw(); });
  canvas.addEventListener('pointerleave', () => { c.hoverX = null; draw(); });
  c.set = (spec, label) => { c.spec = spec; if (label) canvas.setAttribute('aria-label', label); draw(); };
  return c;
}

function spark(canvas, values, color, max) {
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w) return;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const vs = values.filter(v => v != null);
  if (vs.length < 2) return;
  const top = max != null ? max : Math.max(...vs) || 1;
  const step = w / (limit - 1), x0 = w - (values.length - 1) * step;
  g.beginPath();
  values.forEach((v, i) => { const x = x0 + i * step, y = h - (Math.min(v || 0, top) / top) * (h - 2) - 1; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = color; g.lineWidth = 1.5; g.stroke();
  g.lineTo(w, h); g.lineTo(x0, h); g.closePath();
  g.globalAlpha = .15; g.fillStyle = color; g.fill(); g.globalAlpha = 1;
}

// One hue, light to dark with load on a light surface and the reverse on a dark
// one, so a busy core always stands out from the background.
const RAMP = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b'];
const rampColor = v => { const r = dark() ? RAMP.slice().reverse() : RAMP; return r[Math.min(r.length - 1, Math.floor(Math.max(0, v) / 100 * r.length))]; };

// ---------------------------------------------------------------- overview
let sortKey = 'name', sortDir = 1;
try { const s = JSON.parse(localStorage.getItem('fleetmon.sort')); if (s) { sortKey = s.k; sortDir = s.d; } } catch {}

const last = h => h.latest || h.history[h.history.length - 1];
const COLS = [
  { k: 'name', t: 'Machine', v: h => h.info.name },
  { k: 'cpu', t: 'CPU', v: h => last(h)?.cpu_pct ?? -1 },
  { k: 'mem', t: 'Memory', v: h => memPct(last(h), h.info) ?? -1 },
  { k: 'disk', t: 'Disk', v: h => diskPct(mainDisk(h.latest)) ?? -1 },
  { k: 'net', t: 'Network', v: h => (last(h)?.net_rx_bps ?? 0) + (last(h)?.net_tx_bps ?? 0) },
  { k: 'temp', t: 'Temp', v: h => last(h)?.temp_max_c ?? -1 },
  { k: 'load', t: 'Load', v: h => last(h)?.load_avg?.[0] ?? -1 },
  { k: 'up', t: 'Uptime', v: h => last(h)?.uptime_s ?? -1 },
];

function gauge(v, lvl, text, what) {
  if (v == null) return el('span', { class: 'muted' }, '—');
  return el('div', { class: 'gauge' },
    el('div', { class: 'meter ' + lvl }, el('div', { style: `width:${Math.min(100, v).toFixed(1)}%` })),
    el('span', { class: 'v num' }, text, flag(lvl, what)));
}

function renderOverview() {
  if (!hosts.size) { overview.replaceChildren(el('div', { class: 'card empty' }, 'No agents yet.')); return; }
  const col = COLS.find(c => c.k === sortKey) || COLS[0];
  const list = [...hosts.values()].sort((a, b) => {
    const x = col.v(a), y = col.v(b);
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sortDir;
  });
  const head = el('tr', {}, ...COLS.map(c => el('th', {
    'data-sort': c.k, 'aria-sort': c.k === sortKey ? (sortDir > 0 ? 'ascending' : 'descending') : null,
    onclick: () => { sortDir = sortKey === c.k ? -sortDir : (c.k === 'name' ? 1 : -1); sortKey = c.k;
      try { localStorage.setItem('fleetmon.sort', JSON.stringify({ k: sortKey, d: sortDir })); } catch {}
      renderOverview(); },
  }, c.t, c.k === sortKey ? (sortDir > 0 ? ' ↑' : ' ↓') : '')));
  const rows = list.map(h => {
    const L = last(h), i = h.info, m = memPct(L, i), d = mainDisk(h.latest), dp = diskPct(d);
    const open = () => { location.hash = 'host/' + encodeURIComponent(i.name); };
    return el('tr', { class: h.online ? '' : 'off', tabindex: 0, onclick: open, onkeydown: e => { if (e.key === 'Enter') open(); } },
      el('td', {}, el('div', { class: 'who' }, el('span', { class: 'dot' + (h.online ? '' : ' off') }),
        el('div', {}, el('b', {}, i.name), el('small', {}, h.online ? `${i.os} · ${i.cores} cores` : 'offline')))),
      el('td', {}, gauge(L?.cpu_pct, level(L?.cpu_pct, 75, 90), pct(L?.cpu_pct), 'CPU')),
      el('td', {}, gauge(m, level(m, 80, 92), pct(m), 'Memory'), L ? el('div', { class: 'cell-sub num' }, `${gb(L.mem_used)} / ${gb(i.mem_total)} GB`) : null),
      el('td', {}, dp == null ? el('span', { class: 'muted' }, '—') : [gauge(dp, level(dp, 80, 92), pct(dp), 'Disk'), el('div', { class: 'cell-sub num' }, `${d.mount} · ${size(d.total)}`)]),
      el('td', { class: 'num' }, L ? el('div', {}, `↓ ${rate(L.net_rx_bps)}`, el('div', { class: 'cell-sub' }, `↑ ${rate(L.net_tx_bps)}`)) : '—'),
      el('td', { class: 'num' }, L?.temp_max_c != null ? [`${L.temp_max_c.toFixed(0)} °C`, flag(level(L.temp_max_c, 80, 90), 'Temperature')] : el('span', { class: 'muted' }, '—')),
      el('td', { class: 'num' }, L?.load_avg ? L.load_avg[0].toFixed(2) : el('span', { class: 'muted' }, '—')),
      el('td', { class: 'num' }, L ? dur(L.uptime_s) : '—'));
  });
  overview.replaceChildren(el('div', { class: 'card fleet' }, el('table', {}, el('thead', {}, head), el('tbody', {}, rows))));
}

// ---------------------------------------------------------------- detail
const RES = ['cpu', 'mem', 'disk', 'net', 'temp', 'sys'];
let view = null; // {name, res, range, parts, railItems}
let range = '5m';
try { const r = localStorage.getItem('fleetmon.range'); if (r in RANGES) range = r; } catch {}

function available(h, res) {
  const L = h.latest || {};
  if (res === 'disk') return rich(h);
  if (res === 'temp') return (L.temps || []).length > 0 || h.history.some(s => s.temp_max_c != null);
  return true;
}

function openDetail(name, res) {
  const parts = {
    head: el('div', { class: 'head' }),
    note: el('div', { class: 'note', hidden: true }, 'This agent is version 0.1, which reports only the basics. Update it to 0.2 or later for disks, sensors, interfaces, per-core CPU and processes by memory.'),
    rail: el('nav', { class: 'card rail', 'aria-label': 'Resources' }),
    main: el('section', { class: 'card main' }),
    chart: bigChart(),
  };
  detail.replaceChildren(parts.head, parts.note, el('div', { class: 'perf' }, parts.rail, parts.main));
  view = { name, res, range, parts, railItems: {} };
}

const go = (name, res, r) => { location.hash = `host/${encodeURIComponent(name)}/${res}/${r}`; };

function railItem(h, res) {
  const L = h.latest || h.history[h.history.length - 1] || {}, i = h.info, H = h.history;
  const s1 = css('--s1'), s2 = css('--s2');
  const d = mainDisk(h.latest);
  const spec = {
    cpu: ['CPU', `${pct(L.cpu_pct)}${L.cpu_freq_mhz ? '  ' + (L.cpu_freq_mhz / 1000).toFixed(2) + ' GHz' : ''}`, H.map(s => s.cpu_pct), s1, 100],
    mem: ['Memory', `${gb(L.mem_used || 0)}/${gb(i.mem_total)} GB (${pct(memPct(L, i))})`, H.map(s => memPct(s, i)), s2, 100],
    disk: ['Disk', d ? `${d.mount} ${pct(diskPct(d))} · R ${rate(L.disk_read_bps || 0)}` : '', H.map(s => (s.disk_read_bps || 0) + (s.disk_write_bps || 0)), s1, null],
    net: ['Network', `↓ ${rate(L.net_rx_bps || 0)} ↑ ${rate(L.net_tx_bps || 0)}`, H.map(s => (s.net_rx_bps || 0) + (s.net_tx_bps || 0)), s1, null],
    temp: ['Temperature', L.temp_max_c != null ? `${L.temp_max_c.toFixed(1)} °C hottest` : '', H.map(s => s.temp_max_c), s2, 110],
    sys: ['System', `${i.os}`, null, null, null],
  }[res];
  let b = view.railItems[res];
  if (!b) {
    b = el('button', { type: 'button', onclick: () => go(i.name, res, view.range) },
      el('span', { class: 't' }), el('span', { class: 's num' }), spec[2] ? el('canvas', { 'aria-hidden': 'true' }) : null);
    view.railItems[res] = b;
  }
  b.setAttribute('aria-current', String(view.res === res));
  b.querySelector('.t').textContent = spec[0];
  b.querySelector('.s').textContent = spec[1];
  const c = b.querySelector('canvas');
  if (c) spark(c, spec[2], spec[3], spec[4]);
  return b;
}

function stat(k, v) { return el('div', { class: 'stat' }, el('div', { class: 'k' }, k), el('div', { class: 'v num' }, v)); }

function procTable(rows) {
  return el('table', { class: 'plain' },
    el('tr', {}, el('th', {}, 'Process'), el('th', { class: 'r' }, 'CPU'), el('th', { class: 'r' }, 'Memory')),
    rows.map(p => el('tr', {}, el('td', { class: 'n', title: `pid ${p.pid}` }, p.name),
      el('td', { class: 'r num' }, p.cpu_pct.toFixed(1) + '%'), el('td', { class: 'r num' }, size(p.mem)))));
}

// Series for the main chart, from the live window or a fetched range.
function chartSpec(h, res, points) {
  const s1 = css('--s1'), s2 = css('--s2'), i = h.info;
  const base = { times: points.map(p => p.ts_ms), span: RANGES[view.range], end: Date.now() };
  switch (res) {
    case 'cpu': return { ...base, max: 100, fmt: v => v.toFixed(0) + '%', series: [{ label: 'CPU', color: s1, values: points.map(p => p.cpu_pct) }] };
    case 'mem': return { ...base, max: 100, fmt: v => v.toFixed(0) + '%', series: [{ label: 'in use', color: s2, values: points.map(p => memPct(p, i)) }] };
    case 'disk': return { ...base, unit: 1024, fmt: rate, series: [
      { label: 'read', color: s1, values: points.map(p => p.disk_read_bps ?? null) },
      { label: 'write', color: s2, values: points.map(p => p.disk_write_bps ?? null) }] };
    case 'net': return { ...base, unit: 1024, fmt: rate, series: [
      { label: 'download', color: s1, values: points.map(p => p.net_rx_bps) },
      { label: 'upload', color: s2, values: points.map(p => p.net_tx_bps) }] };
    case 'temp': return { ...base, max: 110, fmt: v => v.toFixed(0) + ' °C', series: [{ label: 'hottest sensor', color: s2, values: points.map(p => p.temp_max_c ?? null) }] };
  }
  return null;
}

let fetchSeq = 0;
async function loadChart(h) {
  const v = view;
  if (!v || v.res === 'sys') return;
  let points = h.history, empty;
  if (v.range !== '5m') {
    const seq = ++fetchSeq;
    try { points = await fetchRange(h.info.name, v.range); }
    catch { points = []; empty = 'Could not load history'; }
    if (seq !== fetchSeq || view !== v) return; // a newer request won
    if (!hubHasHistory) empty = 'This hub keeps no history — start it with --db';
  }
  const spec = chartSpec(h, v.res, points);
  if (!spec) return;
  spec.empty = empty;
  v.parts.chart.set(spec, `${v.res} over the last ${v.range}`);
}

function renderMain(h) {
  const { parts, res } = view, i = h.info, L = h.latest || h.history[h.history.length - 1] || {};
  const s1 = css('--s1'), s2 = css('--s2');
  const legend = (...s) => el('div', { class: 'legend' }, s.map(([label, color]) => el('span', {}, el('span', { class: 'sw', style: `background:${color}` }), label)));
  const title = { cpu: 'CPU', mem: 'Memory', disk: 'Disk', net: 'Network', temp: 'Temperature', sys: 'System' }[res];
  const d0 = mainDisk(h.latest);
  const sub = { cpu: i.cpu_model, mem: size(i.mem_total), disk: d0 ? `${d0.fs} · ${d0.kind}` : '', net: (L.ifaces || [])[0]?.name || '', temp: '', sys: i.name }[res];
  const kids = [el('div', { class: 'main-head' }, el('h3', {}, title), el('span', { class: 'sub' }, sub || ''))];
  if (res !== 'sys') {
    if (res === 'disk') kids.push(legend(['read', s1], ['write', s2]));
    if (res === 'net') kids.push(legend(['download', s1], ['upload', s2]));
    kids.push(parts.chart.root);
  }
  const m = memPct(L, i);
  switch (res) {
    case 'cpu': {
      kids.push(el('div', { class: 'stats' },
        stat('Utilization', pct(L.cpu_pct)), L.cpu_freq_mhz ? stat('Speed', `${(L.cpu_freq_mhz / 1000).toFixed(2)} GHz`) : null,
        stat('Cores', i.physical_cores && i.physical_cores !== i.cores ? `${i.cores} (${i.physical_cores} phys)` : `${i.cores}`),
        L.proc_count ? stat('Processes', L.proc_count) : null,
        L.load_avg ? stat('Load 1 · 5 · 15', L.load_avg.map(x => x.toFixed(2)).join(' · ')) : null,
        L.uptime_s != null ? stat('Up time', dur(L.uptime_s)) : null));
      const cores = L.cpu_cores || [];
      if (cores.length) kids.push(el('div', {}, el('h4', {}, 'Per core'), el('div', { class: 'cores' }, cores.map((v, k) =>
        el('div', { class: 'core', title: `core ${k}: ${v.toFixed(0)}%` },
          el('div', { class: 'bar' }, el('div', { class: 'fill', style: `height:${Math.min(100, v).toFixed(1)}%;background:${rampColor(v)}` })),
          el('span', { class: 'num' }, k))))));
      if ((L.top || []).length) kids.push(el('div', {}, el('h4', {}, 'Top processes by CPU'), procTable(L.top)));
      break;
    }
    case 'mem':
      kids.push(el('div', { class: 'stats' },
        stat('In use', size(L.mem_used || 0)), L.mem_available ? stat('Available', size(L.mem_available)) : null,
        stat('Total', size(i.mem_total)), stat('Used', pct(m)),
        stat('Swap', L.swap_total ? `${gb(L.swap_used)} / ${gb(L.swap_total)} GB` : 'none')));
      if ((L.top_mem || []).length) kids.push(el('div', {}, el('h4', {}, 'Top processes by memory'), procTable(L.top_mem)));
      break;
    case 'disk':
      kids.push(el('div', { class: 'stats' }, stat('Read', rate(L.disk_read_bps || 0)), stat('Write', rate(L.disk_write_bps || 0))));
      kids.push(el('div', {}, el('h4', {}, 'Volumes'), (L.disks || []).map(d => {
        const p = diskPct(d), lv = level(p, 80, 92);
        return el('div', { class: 'item' },
          el('div', { class: 'line' }, el('strong', {}, d.mount), el('span', { class: 'muted' }, `${d.fs} · ${d.kind}`)),
          el('div', { class: 'meter ' + lv }, el('div', { style: `width:${p.toFixed(1)}%` })),
          el('div', { class: 'line num' }, el('span', {}, `${size(d.total - d.available)} of ${size(d.total)} · ${p.toFixed(0)}%`, flag(lv, 'Disk usage')),
            el('span', { class: 'muted' }, `R ${rate(d.read_bps)} · W ${rate(d.write_bps)}`)));
      })));
      break;
    case 'net':
      kids.push(el('div', { class: 'stats' }, stat('Download', rate(L.net_rx_bps || 0)), stat('Upload', rate(L.net_tx_bps || 0))));
      if ((L.ifaces || []).length) kids.push(el('div', {}, el('h4', {}, 'Interfaces'), el('table', { class: 'plain' },
        el('tr', {}, el('th', {}, 'Interface'), el('th', { class: 'r' }, 'Download'), el('th', { class: 'r' }, 'Upload')),
        L.ifaces.map(f => el('tr', {}, el('td', { class: 'n' }, f.name), el('td', { class: 'r num' }, rate(f.rx_bps)), el('td', { class: 'r num' }, rate(f.tx_bps)))))));
      break;
    case 'temp':
      kids.push(el('div', { class: 'stats' }, stat('Hottest', L.temp_max_c != null ? `${L.temp_max_c.toFixed(1)} °C` : '—'), stat('Sensors', (L.temps || []).length)));
      kids.push(el('div', {}, el('h4', {}, 'Sensors'), (L.temps || []).map(t => {
        const cap = t.critical || 105, p = t.celsius / cap * 100, lv = level(p, 75, 90);
        return el('div', { class: 'item' },
          el('div', { class: 'line num' }, el('span', {}, t.label), el('span', {}, `${t.celsius.toFixed(1)} °C`, flag(lv, 'Temperature'))),
          el('div', { class: 'meter ' + lv }, el('div', { style: `width:${Math.min(100, p).toFixed(1)}%` })));
      })));
      break;
    case 'sys': {
      const dl = el('dl');
      [['Machine', i.name], ['Status', h.online ? 'online' : 'offline'], ['OS', i.os], ['Kernel', i.kernel], ['Architecture', i.arch], ['CPU', i.cpu_model],
       ['Cores', i.physical_cores && i.physical_cores !== i.cores ? `${i.cores} logical · ${i.physical_cores} physical` : `${i.cores}`],
       ['Memory', size(i.mem_total)], ['Booted', i.boot_time ? new Date(i.boot_time * 1000).toLocaleString() : null],
       ['Up time', L.uptime_s != null ? dur(L.uptime_s) : null], ['Agent', i.agent_version]]
        .filter(([, v]) => v).forEach(([k, v]) => dl.append(el('dt', {}, k), el('dd', { class: 'num' }, v)));
      kids.push(dl);
      break;
    }
  }
  parts.main.replaceChildren(...kids.filter(Boolean));
}

function renderDetail({ refetch = false } = {}) {
  if (!view) return;
  const h = hosts.get(view.name);
  if (!h) { detail.replaceChildren(el('div', { class: 'card empty' }, `No machine called “${view.name}”. `, el('a', { href: '#' }, 'All machines'))); view = null; return; }
  const { parts } = view, i = h.info;
  if (!available(h, view.res)) view.res = 'cpu';
  parts.head.replaceChildren(
    el('a', { class: 'back', href: '#' }, '← All machines'),
    el('span', { class: 'dot' + (h.online ? '' : ' off') }), el('h2', {}, i.name),
    el('span', { class: 'muted' }, h.online ? i.os : 'offline'),
    el('div', { class: 'ranges', role: 'group', 'aria-label': 'Time range' }, Object.keys(RANGES).map(r =>
      el('button', { type: 'button', 'aria-pressed': String(r === view.range), onclick: () => go(i.name, view.res, r) }, r))));
  parts.note.hidden = rich(h) || !h.latest;
  parts.rail.replaceChildren(...RES.filter(r => available(h, r)).map(r => railItem(h, r)));
  renderMain(h);
  // The live window redraws on every sample; a stored range only when due.
  if (view.range === '5m' || refetch) loadChart(h);
  else if (parts.chart.spec) { parts.chart.spec.end = Date.now(); parts.chart.set(parts.chart.spec); }
}

// ---------------------------------------------------------------- routing
function route() {
  const m = location.hash.match(/^#host\/([^/]+)(?:\/([a-z]+))?(?:\/([0-9a-z]+))?$/);
  if (m) {
    const name = decodeURIComponent(m[1]);
    const res = RES.includes(m[2]) ? m[2] : 'cpu';
    const r = m[3] in RANGES ? m[3] : range;
    if (r !== range) { range = r; try { localStorage.setItem('fleetmon.range', r); } catch {} }
    overview.hidden = true; detail.hidden = false;
    if (!view || view.name !== name) openDetail(name, res);
    view.res = res; view.range = r;
    renderDetail({ refetch: true });
    document.title = `${name} · fleetmon`;
  } else {
    view = null; detail.hidden = true; overview.hidden = false;
    document.title = 'fleetmon';
    renderOverview();
  }
}
addEventListener('hashchange', route);
addEventListener('resize', () => view ? renderDetail() : renderOverview());
// A stored range refreshes on its own schedule; the live window needs no timer.
setInterval(() => { if (view && view.range !== '5m') { const h = hosts.get(view.name); if (h) loadChart(h); } }, 20000);

// ---------------------------------------------------------------- live data
let overviewQueued = false;
function touched(name) {
  if (view) { if (view.name === name) renderDetail(); return; }
  if (location.hash.startsWith('#host/' + encodeURIComponent(name))) { route(); return; }
  // Several hosts report each second; redraw the table once per frame.
  if (!overviewQueued) { overviewQueued = true; requestAnimationFrame(() => { overviewQueued = false; if (!view) renderOverview(); }); }
}

function onMsg(m) {
  switch (m.type) {
    case 'snapshot':
      hosts.clear();
      for (const h of m.hosts) { hosts.set(h.info.name, h); limit = Math.max(limit, h.history.length); }
      route();
      break;
    case 'host': {
      const h = hosts.get(m.info.name) || { history: [], latest: null };
      hosts.set(m.info.name, { ...h, info: m.info, online: true });
      touched(m.info.name);
      break;
    }
    case 'sample': {
      const h = hosts.get(m.host); if (!h) return;
      h.latest = m.sample;
      h.history.push(slim(m.sample));
      if (h.history.length > limit) h.history.shift();
      touched(m.host);
      break;
    }
    case 'offline': {
      const h = hosts.get(m.host); if (!h) return;
      h.online = false; touched(m.host);
      break;
    }
    case 'removed':
      hosts.delete(m.host);
      if (view && view.name === m.host) renderDetail(); else if (!view) renderOverview();
      break;
  }
}

let backoff = 500;
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen = () => { backoff = 500; status.textContent = 'live'; };
  ws.onmessage = e => onMsg(JSON.parse(e.data));
  ws.onclose = () => {
    status.textContent = 'hub unreachable — retrying';
    setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 10000);
  };
}
connect();
</script>
</body>
</html>
